# Cross-platform CI/CD for rust-assistant
# Builds, tests, and lints on Linux, macOS, and Windows.
# Creates GitHub releases with binaries for all platforms on version tags.

name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Quality checks (fast, run on every push) ──
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-${{ matrix.os }}"

      - name: Check formatting
        run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::all

      - name: Build
        run: cargo build --all-features

      - name: Test (no model downloads)
        run: cargo test --all-features -- --skip needs_model
        env:
          RUST_TEST_NOCAPTURE: "1"

  # ── Release build (on tag only) ──
  release:
    name: Release (${{ matrix.target }})
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (ARM Linux)
        if: matrix.use_cross
        run: |
          cargo install cross
          echo "CROSS_CMD=cross" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"

      - name: Build release binary
        run: |
          BUILD_CMD="${{ matrix.use_cross && 'cross' || 'cargo' }}"
          $BUILD_CMD build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          BINARY_NAME="rust-assistant${{ matrix.ext }}"
          PACKAGE_NAME="rust-assistant-${{ matrix.target }}"
          
          mkdir -p "$PACKAGE_NAME"
          cp "target/${{ matrix.target }}/release/$BINARY_NAME" "$PACKAGE_NAME/"
          cp README.md LICENSE "$PACKAGE_NAME/"
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "${PACKAGE_NAME}.zip" "$PACKAGE_NAME/"
          else
            tar czf "${PACKAGE_NAME}.tar.gz" "$PACKAGE_NAME/"
          fi
        shell: bash

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust-assistant-*.tar.gz
            rust-assistant-*.zip
          generate_release_notes: true

  # ── Docker image (Linux only, on tag) ──
  docker:
    name: Docker
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
